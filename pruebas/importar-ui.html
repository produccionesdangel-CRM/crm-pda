  NO necesita internet, ni Google, ni permisos: trae incrustados un .xlsx y un
  .ods de verdad (hechos por otras herramientas). Recorre el camino completo:
  leer, analizar duplicados por teléfono y nombre, confirmar, importar, volver a
  cargar el mismo archivo, y el ARCHIVO ENLAZADO (con un manejador simulado,
  porque el selector nativo de archivos no se puede accionar en una prueba).

  Cómo correrla (desde la carpeta del repositorio):
      node pruebas/servir.mjs
      y abrir en el navegador:  http://127.0.0.1:8080/pruebas/importar-ui.html

  El resultado se pone en el título de la página:
      PRUEBA-IMPORTAR-OK   /   PRUEBA-IMPORTAR-FALLAS-<n>
-->

                    comprobar('quedaron marcados para subir a la nube', nuevos.every(function (p) { return p.firmaImportacion; }));

                    /* 5) Volver a cargar el mismo archivo: ya no debe proponer nada. */
                    return imp.procesarArchivo(new w.File([bytes], 'respuestas.xlsx', { type: 'application/vnd.ms-excel' })).then(function () {
                        var a2 = imp.estado.analisis;
                        comprobar('al recargar el mismo archivo ya no propone ninguna fila nueva',
                            a2.nuevas.length === 0 && a2.repetidas.length === 2 && a2.duplicadas.length === 1,
                            JSON.stringify({ n: a2.nuevas.length, r: a2.repetidas.length, d: a2.duplicadas.length }));
                    });
                }).then(function () {
                    /* 6) Pegar filas a mano (mismo camino de datos). */
                    imp.abrirPanel('archivo');
                    var area = d.getElementById('imp-pegar');
                    if (area) {
                        area.value = 'Nombre;Teléfono;Comentarios\n"Ruiz, Sofia";5544332211;"Quiere cotizar, urge"';
                        d.getElementById('imp-analizar-pegado').click();
                        var a3 = imp.estado.analisis;
                        comprobar('pegar filas a mano tambien funciona (con punto y coma y comas dentro de comillas)',
                            a3 && a3.nuevas.length === 1 && /Ruiz, Sofia/.test(a3.nuevas[0].nombre), JSON.stringify(a3 ? { n: a3.nuevas.length } : {}));
                    }
                    return pruebasDelEnlazado();
                }).then(function () {
                    /* 7) La lista de prospectos del CRM se repinta. */
                    var errorRender = null;
                    try { w.renderizarProspectos(); } catch (e) { errorRender = e.message; }
                    comprobar('el CRM repinta la lista de prospectos con lo importado', errorRender === null, errorRender || '');
                    log('');
                    comprobar('sin errores de JavaScript en la pagina', errores.length === 0, errores.join(' | '));
                    terminar();
                }).catch(function (e) {
                    mal('la importacion lanzo un error: ' + ((e && e.message) || e));
                    terminar();
                });
            }, 2200);
        });

        /* Pruebas del ARCHIVO ENLAZADO (se revisa solo). Se usa un manejador
           simulado porque el selector nativo de archivos no se puede accionar
           desde una prueba automática. */
        function pruebasDelEnlazado() {
            var w = marco.contentWindow, d = marco.contentDocument;
            var imp = w.ImportarProspectos;
            if (!imp) { mal('no hay modulo para probar el archivo enlazado'); return Promise.resolve(); }
            log('');
            log('--- archivo enlazado ---');

            /* Se espera a que el módulo termine su propio intento de restaurar el
               archivo (lo hace 2.5 s después de cargar) para no chocar con él. */
            return new Promise(function (res) { setTimeout(res, 3200); }).then(function () {
                return sondaIndexedDB();
            }).then(function (estadoBD) {
                log('       [diagnóstico] IndexedDB: ' + estadoBD);
                return pruebasEnlazadoEnSi(imp, w, d);
            }).catch(function (e) {
                mal('el archivo enlazado falló: ' + ((e && e.message) || e));
            });
        }

        /* Espera a que se cumpla algo, revisando cada 250 ms. */
        function esperarHasta(condicion, limiteMs) {
            var inicio = Date.now();
            return new Promise(function (res) {
                var revisar = function () {
                    var ok = false;
                    try { ok = !!condicion(); } catch (e) { ok = false; }
                    if (ok) { res(true); return; }
                    if (Date.now() - inicio > (limiteMs || 30000)) { res(false); return; }
                    setTimeout(revisar, 250);
                };
                revisar();
            });
        }

        /* ¿El navegador deja guardar el acceso al archivo? (se informa, no se califica) */
        function sondaIndexedDB() {
            var w = marco.contentWindow;
            return new Promise(function (res) {
                var respondido = false;
                var terminar = function (t) { if (!respondido) { respondido = true; res(t); } };
                setTimeout(function () { terminar('el navegador no respondió en 3 s'); }, 3000);
                try {
                    var p = w.indexedDB.open('pda_archivos_enlazados', 1);
                    p.onupgradeneeded = function () {
                        if (!p.result.objectStoreNames.contains('archivos')) p.result.createObjectStore('archivos');
                    };
                    p.onsuccess = function () {
                        try {
                            var t = p.result.transaction('archivos', 'readonly');
                            var g = t.objectStore('archivos').get('archivo');
                            g.onsuccess = function () { terminar(g.result ? ('hay un acceso guardado: ' + (g.result.name || '?')) : 'funciona (sin accesos guardados)'); };
                            g.onerror = function () { terminar('funciona, pero no pudo leer'); };
                        } catch (e) { terminar('abrió pero falló la lectura: ' + e.message); }
                    };
                    p.onerror = function () { terminar('bloqueado por el navegador'); };
                } catch (e) { terminar('no disponible: ' + e.message); }
            });
        }

        function pruebasEnlazadoEnSi(imp, w, d) {
            var csvEnlazado = 'Nombre;Teléfono;Correo;Comentarios\n' +
                'Ana Lopez Ruiz;55 4444 5555;;ya existia\n' +
                'Diego Rivera;55 1111 2222;diego@correo.com;llego despues por el archivo\n';
            var archivo1 = new w.File([csvEnlazado], 'respuestas.csv', { type: 'text/csv', lastModified: 1000 });
            var archivo2 = new w.File([csvEnlazado + 'Elena Paz;55 3333 4444;;nueva de hoy\n'], 'respuestas.csv', { type: 'text/csv', lastModified: 2000 });
            var actual = archivo1;
            var permiso = 'granted';
            var handleFalso = {
                name: 'respuestas.csv',
                queryPermission: function () { return Promise.resolve(permiso); },
                requestPermission: function () { permiso = 'granted'; return Promise.resolve('granted'); },
                getFile: function () { return Promise.resolve(actual); }
            };

            /* La app recarga datos desde el almacén del navegador (roto en este
               entorno de prueba), así que el prospecto de prueba se vuelve a sembrar. */
            if (!w.prospectos.some(function (p) { return p.id === 'pro_existente'; })) {
                w.prospectos.push({ id: 'pro_existente', nombre: 'Ana Lopez Ruiz', telefono: '+52 55 4444 5555', email: '', faseActual: 'Interesado', historialFases: [], notasGenerales: '', clienteId: null, fechaRegistro: '2026-09-01' });
                bien('se volvió a sembrar el prospecto de prueba (la app recargó datos)');
            }

            imp.estado.handle = handleFalso;
            imp.estado.ultimoArchivo = null;

            /* 1) Autenticación pendiente */
            permiso = 'prompt';
            return imp.revisarEnlazado(true).then(function () {
                mal('debía avisar que hacía falta autorizar el archivo');
            }).catch(function (e) {
                comprobar('avisa cuando el navegador pide autorizar otra vez', /autorizar/i.test((e && e.message) || ''), (e && e.message) || '');
            }).then(function () {
                permiso = 'granted';
                /* 2) Primera lectura del archivo enlazado */
                return imp.revisarEnlazado(true);
            }).then(function (r) {
                comprobar('lee el archivo enlazado la primera vez', !!r && r.cambio === true, JSON.stringify(r && { cambio: r.cambio }));
                var a = imp.estado.analisis;
                comprobar('del archivo enlazado detecta 1 duplicada (Ana) y 1 nueva (Diego)',
                    a.duplicadas.length === 1 && a.nuevas.length === 1 && /Diego/.test(a.nuevas[0].nombre),
                    JSON.stringify({ d: a.duplicadas.length, n: a.nuevas.map(function (x) { return x.nombre; }) }));
                /* 3) Sin cambios: no debe volver a leerlo ni volver a proponerlo */
                comprobar('la comparación interna reconoce que el archivo está igual',
                    imp.pruebas.archivoCambio(imp.estado.ultimoArchivo, actual) === false,
                    'el registro dice ' + JSON.stringify(imp.estado.ultimoArchivo && { nombre: imp.estado.ultimoArchivo.nombre, lm: imp.estado.ultimoArchivo.lastModified, size: imp.estado.ultimoArchivo.size }));
                return imp.revisarEnlazado(true).then(function (r2) {
                    comprobar('si el archivo no cambió, no vuelve a procesarlo', r2 && r2.cambio === false, JSON.stringify(r2 && { cambio: r2.cambio }));
                });
            }).then(function () {
                /* 4) El archivo cambió: avisa (auto apagado). Diego sigue sin
                   importarse (auto apagado), así que lo nuevo son Diego y Elena. */
                actual = archivo2;
                return imp.revisarEnlazado(true);
            }).then(function (r) {
                comprobar('detecta que el archivo cambió y avisa sin importar (auto apagado)',
                    r && r.cambio === true && r.importados === 0,
                    JSON.stringify(r && { cambio: r.cambio, importados: r.importados, nuevas: r.analisis.nuevas.length }));
                /* 5) Con automático encendido: agrega sola todo lo pendiente
                   (se mide por lo que reporta el módulo: la app puede recargar
                   el arreglo global y no es una medida confiable aquí). */
                var cfg = JSON.parse(w.localStorage.getItem('pda_importar_config_v1') || '{}');
                cfg.auto = true; cfg.origenPorDefecto = 'Formulario Google'; cfg.faseInicial = 'Interesado';
                cfg.criterioDuplicado = { telefono: true, nombre: true };
                w.localStorage.setItem('pda_importar_config_v1', JSON.stringify(cfg));
                actual = new w.File([csvEnlazado + 'Elena Paz;55 3333 4444;;nueva de hoy\nFrida Solis;55 5555 6666;;otra mas\n'], 'respuestas.csv', { type: 'text/csv', lastModified: 3000 });
                return imp.revisarEnlazado(true).then(function (r3) {
                    comprobar('con "agregar sola" encendido, importa lo nuevo sin preguntar',
                        r3 && r3.automatico === true && r3.importados === 3,
                        JSON.stringify(r3 && { auto: r3.automatico, importados: r3.importados, nuevas: r3.analisis.nuevas.length }));
                    comprobar('y los que entraron quedan con la marca de importación',
                        w.prospectos.filter(function (p) { return p.firmaImportacion; }).length >= 3 &&
                        w.prospectos.filter(function (p) { return p.firmaImportacion; }).every(function (p) { return p.fuenteCaptacion === 'Importación de archivo'; }),
                        'marcados=' + w.prospectos.filter(function (p) { return p.firmaImportacion; }).length);
                });
            }).then(function () {
                /* 6) LA REVISIÓN AUTOMÁTICA POR TEMPORIZADOR (el caso que reportó
                   Jorge: "tengo marcado agregar los nuevos sola y no los agrega").
                   Se programa la revisión cada 10 segundos, se cambia el archivo y
                   se espera a que el propio temporizador lo detecte y lo importe. */
                var cfgAuto = JSON.parse(w.localStorage.getItem('pda_importar_config_v1') || '{}');
                cfgAuto.auto = true;
                cfgAuto.enlazado = true;
                cfgAuto.intervaloSegundos = 10;
                cfgAuto.origenPorDefecto = 'Formulario Google';
                cfgAuto.faseInicial = 'Interesado';
                cfgAuto.criterioDuplicado = { telefono: true, nombre: true };
                w.localStorage.setItem('pda_importar_config_v1', JSON.stringify(cfgAuto));
                imp.estado.revisionesSinLeer = 0;
                actual = new w.File([csvEnlazado + 'Nueva Persona;55 8888 9999;nueva@correo.com;llego por el temporizador\n'], 'respuestas.csv', { type: 'text/csv', lastModified: 5000 });
                imp.programarRevisionEnlazada();
                comprobar('el temporizador de revisión queda programado',
                    imp.estado.temporizador !== null && imp.estado.intervaloProgramado === 10,
                    JSON.stringify({ temporizador: !!imp.estado.temporizador, intervalo: imp.estado.intervaloProgramado }));
                var antesAuto = w.prospectos.length;
                return esperarHasta(function () {
                    return w.prospectos.some(function (p) { return /Nueva Persona/.test(p.nombre || ''); });
                }, 30000).then(function (llego) {
                    comprobar('el temporizador detecta el archivo cambiado y agrega el prospecto solo',
                        llego === true,
                        JSON.stringify({ revisiones: imp.estado.revisiones, ultima: imp.estado.ultimaRevision && imp.estado.ultimaRevision.resultado }));
                    comprobar('y deja anotado en el registro qué pasó en la última revisión',
                        !!imp.estado.ultimaRevision && /agregó/i.test(imp.estado.ultimaRevision.resultado),
                        JSON.stringify(imp.estado.ultimaRevision));
                    if (llego) bien('el prospecto nuevo entró sin que nadie pulsara nada (prospectos: ' + w.prospectos.length + ')');
                    imp.detenerRevisionEnlazada();
                });
            }).then(function () {
                /* 7) Desconectar (con límite de tiempo: si el navegador se queda
                   pensando en el almacén, la prueba no se debe colgar). */
                var resuelto = false;
                return Promise.race([
                    imp.desconectarEnlazado().then(function () { resuelto = true; comprobar('desconectar el archivo deja de revisarlo', !imp.estado.handle); }),
                    new Promise(function (res) { setTimeout(function () { if (!resuelto) mal('desconectar tardó demasiado'); res(); }, 4000); })
                ]);
            }).catch(function (e) {
                mal('el archivo enlazado falló: ' + ((e && e.message) || e));
            });
        }

        function terminar() {
            log('');
            log('== ' + (fallas ? ('PRUEBA-IMPORTAR-FALLAS-' + fallas) : 'PRUEBA-IMPORTAR-OK') + ' ==');
            document.title = fallas ? ('PRUEBA-IMPORTAR-FALLAS-' + fallas) : 'PRUEBA-IMPORTAR-OK';
        }
    })();
    </script>
