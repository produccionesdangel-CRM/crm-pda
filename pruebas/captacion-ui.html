<!DOCTYPE html>
<!--
  Prueba funcional de la captación de prospectos desde un formulario de Google.
  NO necesita la cuenta de Google: usa la pestaña "Pegar filas" (el mismo camino
  de datos que la hoja de cálculo) y comprueba el análisis de duplicados y la
  importación real de los prospectos.

  Cómo correrla (desde la carpeta del repositorio):
      node pruebas/servir.mjs
      y abrir en el navegador:  http://127.0.0.1:8080/pruebas/captacion-ui.html

  El resultado se pone en el título de la página:
      PRUEBA-CAPTACION-OK   /   PRUEBA-CAPTACION-FALLAS-<n>
-->

<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>PRUEBA-CAPTACION-PENDIENTE</title>
    <style>body{font-family:'Courier New',monospace;background:#0d0d0d;color:#e8e8e8;padding:14px;font-size:12.5px}
    #datos{white-space:pre-wrap;background:#1a1a1a;border:1px solid #333;border-radius:8px;padding:12px;margin-bottom:10px}
    iframe{width:1250px;height:700px;border:1px solid #333;border-radius:8px;background:#000}</style>
</head>
<body>
    <h3>Prueba funcional: captación de prospectos desde formulario (sin Google)</h3>
    <div id="datos">Esperando…</div>
    <iframe id="marco"></iframe>
    <script>
    /* Prueba el camino COMPLETO de datos sin necesitar la cuenta de Google:
       pega filas como si vinieran de la hoja, revisa el analisis, importa y
       verifica que los prospectos queden bien y que NO se dupliquen.
       Uso: prueba3.html?archivo=X */
    (function () {
        var archivo = new URLSearchParams(location.search).get('archivo') || '../index.html';
        var marco = document.getElementById('marco');
        var caja = document.getElementById('datos');
        var salida = [];
        var fallas = 0;
        function log(t) { salida.push(t); caja.innerHTML = salida.join('\n'); }
        function bien(t) { log('  OK    ' + t); }
        function mal(t) { fallas++; log('  FALLA ' + t); }
        function comprobar(t, cond, detalle) { if (cond) bien(t); else mal(t + (detalle ? '  -> ' + detalle : '')); }

        marco.src = archivo;
        marco.addEventListener('load', function () {
            setTimeout(function () {
                var w = marco.contentWindow, d = marco.contentDocument;
                var errores = [];
                w.addEventListener('error', function (e) { errores.push(e.message); });
                log('Archivo: ' + archivo);

                var cap = w.CaptacionFormularios;
                if (!cap) { mal('no cargo el modulo de captacion'); terminar(); return; }
                bien('el modulo de captacion quedo cargado');

                /* 1) Un prospecto que ya existe (para provocar un duplicado por telefono). */
                w.prospectos.push({ id: 'pro_existente', nombre: 'Ana Lopez Ruiz', telefono: '+52 55 4444 5555', email: '', faseActual: 'Interesado', historialFases: [], notasGenerales: '', clienteId: null, fechaRegistro: '2026-09-01' });
                var antes = w.prospectos.length;

                /* 2) El boton en la seccion de Prospectos (solo administrador). */
                w.usuarioActual = { username: 'jorge', nombre: 'Jorge', rol: 'Administrador', admin: true };
                try { cap.ponerBoton(); } catch (e) { mal('ponerBoton lanzo: ' + e.message); }
                var boton = d.getElementById('btn-captacion-formulario');
                comprobar('el boton "Captacion desde formulario" aparece en Prospectos', !!boton);
                if (!boton) { terminar(); return; }

                /* 3) Abre el panel. */
                var errorAbrir = null;
                try { boton.click(); } catch (e) { errorAbrir = e.message; }
                comprobar('el panel abre sin errores', errorAbrir === null, errorAbrir || '');
                var cuerpo = d.getElementById('cap-cuerpo');
                comprobar('el panel ofrece el boton para conectar con Google', !!d.getElementById('cap-conectar'));
                comprobar('el panel muestra la conexion con Google', !!cuerpo && /Sin conectar/i.test(d.getElementById('modal-body').innerHTML));
                comprobar('el panel avisa que el permiso es de solo lectura y que el token no se guarda',
                    !!cuerpo && /solo lectura/i.test(cuerpo.innerHTML) && /no se guarda/i.test(cuerpo.innerHTML));

                /* 4) Pestana "pegar filas" (mismo camino de datos que la hoja). */
                var tabPegado = d.querySelector('[data-cap-tab="pegado"]');
                comprobar('existe la pestana para pegar filas sin dar permisos', !!tabPegado);
                if (!tabPegado) { terminar(); return; }
                tabPegado.click();
                var area = d.getElementById('cap-pegar');
                comprobar('el area para pegar filas se dibuja', !!area);
                if (!area) { terminar(); return; }

                var csv = [
                    'Marca temporal,Nombre completo,Telefono,Correo electronico,Que evento es,Fecha del evento,Presupuesto,Comentarios',
                    '2026-10-07 09:15:00,Ana Lopez Ruiz,55 4444 5555,ana@correo.com,XV anos,2027-03-20,45000,Ya me habia escrito',
                    '2026-10-07 09:20:00,Beatriz Nunez,55 7777 8888,bea@correo.com,Boda,2027-05-10,85000,Quiere ver el paquete Platinum',
                    '2026-10-07 09:25:00,Carlos Mendez,55 9999 0000,,Corporativo,,,Pide cotizacion',
                    ',,,,,,,',
                    ',,Sin Telefono,,Boda,,,Solo dejo el correo'
                ].join('\n');
                area.value = csv;

                /* 5) Analizar: 1 duplicada por telefono, 2 nuevas, 2 sin datos utiles. */
                var errorAnalisis = null;
                try { d.getElementById('cap-analizar-pegado').click(); } catch (e) { errorAnalisis = e.message; }
                comprobar('analizar lo pegado no lanza errores', errorAnalisis === null, errorAnalisis || '');
                var a = cap.estado.analisis;
                comprobar('detecta la respuesta duplicada por telefono (no se importara)', a && a.duplicadas.length === 1, a ? ('duplicadas=' + a.duplicadas.length) : 'sin analisis');
                comprobar('reconoce las 2 respuestas nuevas', a && a.nuevas.length === 2, a ? ('nuevas=' + a.nuevas.length) : 'sin analisis');
                if (a && a.duplicadas.length) comprobar('dice POR QUE es duplicado', /tel[eé]fono/i.test(a.duplicadas[0]._motivo || ''), a.duplicadas[0]._motivo);
                comprobar('la fila vacia y la que no trae nombre ni telefono se ignoran', a && a.vacias === 2, a ? ('vacias=' + a.vacias) : '');
                comprobar('la pantalla de revision muestra la tabla y los conteos', /cap-importar/.test(d.getElementById('cap-cuerpo').innerHTML));

                /* 6) Importar: pide confirmacion en dos pasos. */
                var errorImport = null;
                try { d.getElementById('cap-importar').click(); } catch (e) { errorImport = e.message; }
                comprobar('al importar pide confirmacion antes de guardar', errorImport === null && /cap-confirmar-import/.test(d.getElementById('cap-confirmar').innerHTML), errorImport || 'sin confirmacion');
                var botonConfirmar = d.getElementById('cap-confirmar-import');
                if (botonConfirmar) {
                    try { botonConfirmar.click(); } catch (e) { errorImport = e.message; }
                }
                comprobar('la importacion corre sin errores', errorImport === null, errorImport || '');

                var nuevos = w.prospectos.slice(antes);
                comprobar('se crearon exactamente 2 prospectos nuevos', nuevos.length === 2, 'creados=' + nuevos.length);
                comprobar('no se creo nada con el telefono escrito como texto ("Sin Telefono")',
                    !nuevos.some(function (p) { return /Sin Telefono/i.test(p.telefono || '') || /Prospecto del formulario/i.test(p.nombre || ''); }));
                comprobar('el prospecto duplicado NO se volvio a crear',
                    !w.prospectos.some(function (p) { return p.telefono && String(p.telefono).replace(/\D+/g, '').slice(-10) === '5544445555' && p.id !== 'pro_existente'; }));
                var bea = nuevos.filter(function (p) { return /Beatriz/i.test(p.nombre || ''); })[0];
                comprobar('el prospecto nuevo llego con nombre, telefono y correo', !!bea && bea.telefono === '55 7777 8888' && bea.email === 'bea@correo.com');
                comprobar('los campos que captura el formulario quedan guardados (evento, fecha, presupuesto)',
                    !!bea && bea.tipoEvento === 'Boda' && bea.fechaEvento === '2027-05-10' && bea.presupuesto === '85000',
                    bea ? JSON.stringify({ t: bea.tipoEvento, f: bea.fechaEvento, p: bea.presupuesto }) : '');
                comprobar('el comentario del formulario queda en las notas', !!bea && /Quiere ver el paquete Platinum/.test(bea.notasGenerales || ''));
                comprobar('queda marcado de donde vino y con su historial de fase',
                    !!bea && bea.fuenteCaptacion === 'Formulario Google' && Array.isArray(bea.historialFases) && bea.historialFases.length === 1 && /formulario de Google/i.test(bea.historialFases[0].notas));
                comprobar('quedaron marcados para subir a la nube', nuevos.every(function (p) { return p.firmaFormulario; }));

                /* 7) Volver a revisar la misma hoja: ya no debe proponer nada. */
                var tabPegado2 = d.querySelector('[data-cap-tab="pegado"]');
                if (tabPegado2) {
                    tabPegado2.click();
                    var area2 = d.getElementById('cap-pegar');
                    if (area2) {
                        area2.value = csv;
                        try { d.getElementById('cap-analizar-pegado').click(); } catch (e) { }
                        var a2 = cap.estado.analisis;
                        comprobar('la segunda revision ya no propone ninguna fila nueva',
                            a2 && a2.nuevas.length === 0 && a2.repetidas.length === 2 && a2.duplicadas.length === 1,
                            a2 ? JSON.stringify({ n: a2.nuevas.length, r: a2.repetidas.length, d: a2.duplicadas.length }) : 'sin analisis');
                    }
                }

                /* 8) La lista de prospectos del CRM se puede repintar con lo importado. */
                var errorRender = null;
                try { w.renderizarProspectos(); } catch (e) { errorRender = e.message; }
                comprobar('el CRM repinta la lista de prospectos con lo importado', errorRender === null, errorRender || '');

                log('');
                comprobar('sin errores de JavaScript en la pagina', errores.length === 0, errores.join(' | '));
                terminar();
            }, 2200);
        });

        function terminar() {
            log('');
            log('== ' + (fallas ? ('PRUEBA-CAPTACION-FALLAS-' + fallas) : 'PRUEBA-CAPTACION-OK') + ' ==');
            document.title = fallas ? ('PRUEBA-CAPTACION-FALLAS-' + fallas) : 'PRUEBA-CAPTACION-OK';
        }
    })();
    </script>
</body>
</html>
